<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>이걸 누르면 100만원 💰</title>
<!-- 카톡·SNS 미리보기(Open Graph). 절대 URL이라야 크롤러가 읽음 -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://t0c0-ai.github.io/-If-you-press-this-1-million-won/">
<meta property="og:title" content="이걸 누르면 100만원 💰">
<meta property="og:description" content="버튼을 누르기만 하면 됩니다. …단, 버튼이 계속 도망갑니다 ㅋㅋ">
<meta property="og:image" content="https://t0c0-ai.github.io/-If-you-press-this-1-million-won/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- 파비콘: 외부 파일 없이 SVG. 골드 코인 컨셉 -->
<link rel="icon" href="data:image/svg+xml,
  <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
    <circle cx='50' cy='50' r='46' fill='%23f5c542' stroke='%23b8860b' stroke-width='5'/>
    <text x='50' y='53' font-size='52' text-anchor='middle' dominant-baseline='central' fill='%237a5200' font-family='Georgia,serif' font-weight='bold'>%24</text>
  </svg>">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden; user-select:none; touch-action:none;
    font-family:-apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    /* "진짜 줄 것 같은" 금고 느낌: 깊은 네이비-블랙 + 가운데서 번지는 골드 광채 */
    background:
      radial-gradient(circle at 50% 38%, rgba(245,197,66,.22), transparent 55%),
      linear-gradient(160deg, #0b0e1a 0%, #161a2e 45%, #0b0e1a 100%);
    color:#fff;
  }
  .stage { position:relative; width:100%; height:100%; }

  /* 배경에 둥둥 떠오르는 지폐·코인 (JS가 채워넣음) */
  .money { position:absolute; bottom:-10vh; will-change:transform; opacity:.0;
    animation:rise linear infinite; filter:drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
  @keyframes rise {
    0%   { transform:translateY(0) rotate(0deg); opacity:0; }
    12%  { opacity:.9; }
    88%  { opacity:.9; }
    100% { transform:translateY(-120vh) rotate(220deg); opacity:0; }
  }

  /* 상단 바: 언어탭 + 음소거 + 카운터 */
  .topbar { position:absolute; top:14px; left:0; right:0; display:flex;
    justify-content:space-between; align-items:center; padding:0 16px; z-index:5; }
  .lang { display:flex; gap:0; border:1px solid rgba(245,197,66,.5); border-radius:999px; overflow:hidden; }
  .lang button { background:transparent; color:rgba(255,255,255,.6); border:none; cursor:pointer;
    padding:7px 16px; font-size:14px; font-weight:800; letter-spacing:.5px; transition:.15s; }
  .lang button.on { background:linear-gradient(135deg,#f5c542,#e0a019); color:#3a2700; }
  .right { display:flex; gap:10px; align-items:center; }
  .mute { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:#fff;
    width:38px; height:38px; border-radius:50%; font-size:17px; cursor:pointer; }
  .counter { background:rgba(0,0,0,.35); border:1px solid rgba(245,197,66,.35);
    padding:8px 15px; border-radius:999px; font-size:14px; font-weight:800; white-space:nowrap; }
  .counter b { color:#f5c542; }

  .title { position:absolute; top:13%; left:50%; transform:translateX(-50%); text-align:center; width:92%; z-index:4; }
  .title h1 {
    font-size:clamp(30px, 8vw, 68px); line-height:1.1; letter-spacing:-1px; font-weight:900;
    background:linear-gradient(135deg,#fff6d0 0%,#f5c542 45%,#b8860b 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 2px 30px rgba(245,197,66,.25);
  }
  .title p { margin-top:14px; font-size:clamp(15px,4vw,22px); color:rgba(255,255,255,.7); font-weight:600; }

  /* 진짜 받을 것 같은 황금 버튼 */
  .runaway { position:absolute; top:56%; left:50%; transform:translate(-50%,-50%);
    padding:22px 48px; font-size:clamp(20px,5vw,28px); font-weight:900; color:#3a2700;
    background:linear-gradient(135deg,#ffe9a8 0%,#f5c542 45%,#d99a16 100%);
    border:none; border-radius:18px; cursor:pointer; white-space:nowrap;
    box-shadow:0 8px 0 #9c6f0d, 0 16px 34px rgba(245,197,66,.45), inset 0 1px 2px rgba(255,255,255,.6);
    transition:transform .1s ease; z-index:6; }
  .runaway:active { transform:translate(-50%,-50%) scale(.96); }

  .taunt { position:absolute; bottom:11%; left:50%; transform:translateX(-50%); width:92%;
    text-align:center; font-size:clamp(18px,5vw,28px); font-weight:800; color:#f5c542;
    min-height:40px; transition:opacity .2s; z-index:4; text-shadow:0 2px 12px rgba(0,0,0,.5); }

  .win { position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:24px; z-index:20;
    background:radial-gradient(circle at 50% 40%, rgba(245,197,66,.18), rgba(5,7,14,.96)); }
  .win.show { display:flex; }
  .win h2 { font-size:clamp(36px,10vw,76px); margin-bottom:18px; font-weight:900;
    background:linear-gradient(135deg,#fff6d0,#f5c542,#b8860b);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .win p { font-size:clamp(16px,4.5vw,24px); line-height:1.55; color:rgba(255,255,255,.88); }
  .win small { margin-top:24px; font-size:14px; color:rgba(255,255,255,.45); }

  /* 성공 화면의 "친구한테 떠넘기기" 공유 버튼 */
  .sharebtn { margin-top:30px; padding:16px 34px; font-size:clamp(16px,4.5vw,20px); font-weight:900;
    color:#3a2700; cursor:pointer; border:none; border-radius:14px; white-space:nowrap;
    background:linear-gradient(135deg,#ffe9a8,#f5c542,#d99a16);
    box-shadow:0 6px 0 #9c6f0d, 0 12px 24px rgba(245,197,66,.4); transition:transform .1s; }
  .sharebtn:active { transform:scale(.96); }

  /* 링크 복사 토스트 */
  .toast { position:absolute; bottom:7%; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(20,24,40,.95); border:1px solid rgba(245,197,66,.5); color:#fff;
    padding:12px 22px; border-radius:999px; font-size:15px; font-weight:700;
    opacity:0; pointer-events:none; transition:.25s; z-index:30; white-space:nowrap; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="topbar">
    <div class="lang">
      <button id="ko" class="on" onclick="setLang('ko')">KO</button>
      <button id="en" onclick="setLang('en')">EN</button>
    </div>
    <div class="right">
      <button class="mute" id="mute" onclick="toggleMute()" title="sound">🔊</button>
      <div class="counter"><span id="tlabel">시도</span> <b id="count">0</b><span id="tunit">번</span></div>
    </div>
  </div>

  <div class="title"><h1 id="h1"></h1><p id="sub"></p></div>
  <button class="runaway" id="btn" tabindex="-1"></button>
  <div class="taunt" id="taunt"></div>

  <div class="win" id="win">
    <h2 id="winTitle"></h2>
    <p id="winBody"></p>
    <button class="sharebtn" id="shareBtn" onclick="shareIt()"></button>
    <small id="winSmall"></small>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
  // ── 다국어 텍스트 (KO 기본 / EN 토글) ──────────────────────────────
  const T = {
    ko: {
      title:"이걸 누르면 100만원 💰", sub:"딱 한 번만 누르면 됩니다. 진짜로.",
      btn:"눌러서 받기 👆", tLabel:"시도", tUnit:"번",
      taunt0:"자신 있으면 눌러보시지 😏",
      taunts:["어? 못 누르네? 😂","아깝다, 진짜 줄 뻔했는데 💸","조금만 더!… 안 줌 😝",
        "느려요 느려 🐢","포기각? 😏","오잉? 또 놓침?","손이 떨려요? 🤣",
        "100만원이 도망가요 💨","이쯤 되면 인정 👏","진심이면 잡아봐!"],
      winTitle:"참 잘했어요 🏆",
      winBody:"100번이나 도전하다니… 끈기 인정!<br>상금은 마음속에 입금됐습니다 💸",
      winSmall:"(새로고침하면 다시 약 올림)",
      shareBtn:"친구한테 떠넘기기 😈",
      shareText:"이거 누르면 100만원 준대 ㅋㅋ (근데 절대 못 받음)",
      copied:"링크 복사됨! 친구한테 붙여넣어요 😈"
    },
    en: {
      title:"Press this for $1,000,000 💰", sub:"Just press it once. For real.",
      btn:"Tap to claim 👆", tLabel:"Tries", tUnit:"",
      taunt0:"Press it if you dare 😏",
      taunts:["Oops, missed again? 😂","So close to a million 💸","Almost!… nope 😝",
        "Too slow 🐢","Giving up? 😏","Huh? Missed it again?","Hands shaking? 🤣",
        "Your million is escaping 💨","Okay, respect 👏","Catch it if you mean it!"],
      winTitle:"Well done 🏆",
      winBody:"100 tries?! Respect the persistence!<br>Prize deposited… straight into your heart 💸",
      winSmall:"(Refresh to get teased again)",
      shareBtn:"Pass it to a friend 😈",
      shareText:"Press this for $1,000,000 lol (you'll never catch it)",
      copied:"Link copied! Go paste it to a friend 😈"
    }
  };

  let lang = "ko", tries = 0, muted = false, audioCtx;
  const $ = id => document.getElementById(id);

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    $('h1').textContent = t.title;  $('sub').textContent = t.sub;
    $('btn').textContent = t.btn;   $('tlabel').textContent = t.tLabel;
    $('tunit').textContent = t.tUnit;
    $('taunt').textContent = tries === 0 ? t.taunt0 : t.taunts[lastTaunt];
    $('winTitle').textContent = t.winTitle;
    $('winBody').innerHTML = t.winBody;  // 신뢰된 자체 문자열만, 사용자 입력 아님
    $('winSmall').textContent = t.winSmall;
    $('shareBtn').textContent = t.shareBtn;
    $('ko').classList.toggle('on', lang === 'ko');
    $('en').classList.toggle('on', lang === 'en');
  }
  function setLang(l) { lang = l; render(); }

  // ── 효과음: 외부 파일 없이 Web Audio로 즉석 생성 ──────────────────
  function tone(f1, f2, dur, type = 'square', vol = .12) {
    if (muted) return;
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime, osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(f1, t);
    osc.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    osc.connect(g); g.connect(audioCtx.destination); osc.start(t); osc.stop(t + dur);
  }
  const fleeSound = () => tone(720, 180, .16, 'square');           // 약 올리는 "삐용↓"
  function winSound() {                                            // 동전 쏟아지는 상승음
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, f, .12, 'triangle', .15), i * 90));
  }
  function toggleMute() { muted = !muted; $('mute').textContent = muted ? '🔇' : '🔊'; }

  // ── 떠다니는 돈 배경 ──────────────────────────────────────────────
  const stage = $('stage'), faces = ['💵','💰','🪙','💸','🤑'];
  for (let i = 0; i < 14; i++) {
    const el = document.createElement('div');
    el.className = 'money'; el.textContent = faces[i % faces.length];
    el.style.left = (i * 7 + 3) + '%';
    el.style.fontSize = (22 + (i % 4) * 12) + 'px';
    el.style.animationDuration = (9 + (i % 5) * 2) + 's';
    el.style.animationDelay = (-i * 1.3) + 's';
    stage.appendChild(el);
  }

  // ── 도망 로직 ─────────────────────────────────────────────────────
  const btn = $('btn'), taunt = $('taunt'), win = $('win');
  let lastTaunt = 0, cooling = false;
  const SHARE_URL = 'https://t0c0-ai.github.io/-If-you-press-this-1-million-won/';

  // 위치만 순간이동 — 마우스가 닿기 전에 미리 피하므로 throttle 없이 매번 실행
  function moveBtn() {
    const pad = 12, bw = btn.offsetWidth, bh = btn.offsetHeight;
    const maxX = innerWidth - bw - pad, minY = innerHeight * 0.30, maxY = innerHeight - bh - pad;
    btn.style.left = Math.max(pad, Math.random() * maxX) + 'px';
    btn.style.top  = Math.max(minY, Math.random() * maxY) + 'px';
    btn.style.transform = 'translate(0,0)';
  }
  // 카운트·약올림·소리는 쿨다운(280ms)으로 천천히 — 마우스 한 번 움직였다고 100 채워지지 않게
  function register() {
    if (cooling) return;
    cooling = true; setTimeout(() => cooling = false, 280);
    tries++; $('count').textContent = tries;
    lastTaunt = Math.floor(Math.random() * T[lang].taunts.length);
    taunt.textContent = T[lang].taunts[lastTaunt];
    fleeSound();
    if (tries >= 100) { win.classList.add('show'); winSound(); }
  }
  const flee = () => { moveBtn(); register(); };

  // 데스크탑 핵심: 버튼 반경 + 120px 안에 마우스가 들어오면 닿기 전에 도망 → 절대 못 누름
  document.addEventListener('mousemove', e => {
    const r = btn.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
    if (Math.hypot(dx, dy) < Math.max(r.width, r.height)/2 + 120) { moveBtn(); register(); }
  });
  // 모바일(터치)·키보드 안전망
  btn.addEventListener('touchstart', e => { e.preventDefault(); flee(); }, { passive:false });
  btn.addEventListener('mouseenter', flee);
  btn.addEventListener('click', flee);
  btn.addEventListener('focus', flee);
  btn.addEventListener('keydown', e => { e.preventDefault(); flee(); });

  // ── 공유하기: 모바일은 네이티브 공유창, 데스크탑은 링크 복사 ──────────
  function shareIt() {
    const t = T[lang];
    if (navigator.share) {
      navigator.share({ title: t.title, text: t.shareText, url: SHARE_URL }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(SHARE_URL).then(() => toast(t.copied)).catch(() => toast(SHARE_URL));
    } else {
      toast(SHARE_URL);
    }
  }
  function toast(msg) {
    const el = $('toast'); el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  }

  render();
</script>
</body>
</html>
